<!DOCTYPE html>
<!--
  Built-in renderer: documents and visual plans.

  This file (deliberately not named index.html — see sandbox.js) is the document that runs inside AgentGate's render sandbox — an
  opaque-origin iframe with `default-src 'none'; connect-src 'none'`. It is assembled by
  web/static/js/sandbox.js, which:

    * inlines every agentgate: reference below from the server (the frame cannot fetch),
    * resolves the renderer-local scripts from /static/renderers/doc/ — never from the
      share, so a payload cannot substitute its own renderer.js,
    * injects the decrypted payload as inert JSON in #agentgate-payload,
    * appends the host bridge that reports height and relays settings.

  Elements marked data-agentgate-when="X" are dropped unless the payload actually needs X
  (see detectFeatures in web/static/js/share-kind.js). That keeps mermaid's 3.3 MB out of
  a document with no diagram, highlight.js out of one with no code, and the React/MDX
  bundle — plus the 'unsafe-eval' its compiler needs — out of every plain-Markdown share.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentGate document</title>

<link rel="stylesheet" href="agentgate:tokens">
<link rel="stylesheet" href="agentgate:renderer">
<link rel="stylesheet" href="agentgate:highlight-css" data-agentgate-when="highlight">
<link rel="stylesheet" href="agentgate:highlight-dark-css" media="(prefers-color-scheme: dark)" data-agentgate-when="highlight">
<link rel="stylesheet" href="/static/renderers/common/frame-ui.css">
</head>
<body class="ag-frame">
<div class="ag-doc-toolbar" id="ag-toolbar" hidden>
  <label class="ag-find">
    <span class="ag-find-icon" aria-hidden="true">⌕</span>
    <input type="search" id="ag-find-input" placeholder="Find in document" autocomplete="off" spellcheck="false">
    <span class="ag-find-count" id="ag-find-count"></span>
    <button type="button" id="ag-find-prev" class="ag-find-nav" title="Previous match" aria-label="Previous match">↑</button>
    <button type="button" id="ag-find-next" class="ag-find-nav" title="Next match" aria-label="Next match">↓</button>
  </label>
</div>

<div class="plan-layout" id="ag-layout">
  <!-- Sidebar is added here by the renderer when the bundle has more than one file. -->
  <article class="markdown-body plan-document" id="ag-document"></article>
</div>

<script src="agentgate:marked"></script>
<script src="agentgate:highlight" data-agentgate-when="highlight"></script>
<script src="agentgate:mermaid" data-agentgate-when="mermaid"></script>
<script src="agentgate:mdx" data-agentgate-when="mdx"></script>
<script src="/static/renderers/common/frame-ui.js"></script>
<script src="markdown.js"></script>
<script src="mdx-components.js" data-agentgate-when="mdx"></script>
<script src="renderer.js"></script>
</body>
</html>
